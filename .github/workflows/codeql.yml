name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "33 4 * * 1"

permissions:
  actions: read # private repo: analyze@v3 reads the workflow run to upload results
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning on a private repo needs GitHub Advanced Security, which
    # personal accounts cannot enable; skip until the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: manual # autobuild would run `make all` (lint, race tests, build)
      - run: go build ./...
      - uses: github/codeql-action/analyze@v3
