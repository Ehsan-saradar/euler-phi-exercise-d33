name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "33 4 * * 1"

permissions:
  actions: read # private repo: analyze@v3 reads the workflow run to upload results
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: none # Go needs no build to extract; autobuild would run `make all`
      - uses: github/codeql-action/analyze@v3
