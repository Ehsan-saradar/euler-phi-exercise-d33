name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start the cluster
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Run the end-to-end suite
        run: go test -tags e2e -count=1 -v -timeout 10m ./test/e2e/
      - name: Demo script
        run: ./scripts/demo.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 300
      - name: Tear down
        if: always()
        run: docker compose down -v
